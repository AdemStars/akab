version: '3.8'

services:
  ipfs:
    image: ipfs/kubo:v0.26.0
    container_name: akab-ipfs
    restart: unless-stopped
    ports:
      - "127.0.0.1:4001:4001" # IPFS swarm
      - "127.0.0.1:5001:5001" # IPFS API
      - "127.0.0.1:8080:8080" # IPFS Gateway
    volumes:
      - ipfs_staging:/export
      - ipfs_data:/data/ipfs
    environment:
      - IPFS_PATH=/data/ipfs
    healthcheck:
      test: ["CMD-SHELL", "ipfs swarm peers || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: akab-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
      - "JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in .env (at least 32 characters)}"
      - DATABASE_URL=/app/data/akab.sqlite
      - IPFS_API_URL=http://ipfs:5001
      - IPFS_GATEWAY=http://ipfs:8080/ipfs/
      - IPFS_FALLBACK_LOCAL=true
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@akab.local}
      - "ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:?Set a unique ADMIN_DEFAULT_PASSWORD in .env}"
      - ADMIN_DEFAULT_NAME=${ADMIN_DEFAULT_NAME:-Admin AKAB}
      - MODERATION_REQUIRED_APPROVALS=${MODERATION_REQUIRED_APPROVALS:-2}
    volumes:
      - backend_data:/app/data
    depends_on:
      - ipfs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: akab-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

volumes:
  ipfs_staging:
  ipfs_data:
  backend_data:
